<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>អុកខ្មែរ • Khmer Ouk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="wifi">⌁</div>
    <div class="wallet"><span class="coin">◉</span><b>5200</b><small>P366385</small></div>
    <div class="avatar">●<span>●</span></div>
  </header>

  <section class="clockbar">
    <div class="turn-dot"></div>
    <div class="clock">02:52</div>
    <div class="clock">03:00</div>
  </section>

  <main class="game-card">
    <div class="board-title">អុកខ្មែរ</div>
    <div id="board" class="board" aria-label="ក្តារអុកខ្មែរ"></div>
    <div class="hint">• ដាក់កូន → ដើរកូន</div>
  </main>

  <section class="bottom-player">
    <div class="avatar small">●<span>●</span></div>
    <div class="bottom-clock">02:52</div>
    <div class="bottom-clock">03:00</div>
    <b>P326826</b>
  </section>

  <nav class="actions">
    <button>☷</button><button id="reset">↻</button><button>◉</button><button>?</button>
  </nav>
</div>
<script src="game.js"></script>
</body>
</html>
